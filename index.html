<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Ankara 3D" />
  <title>Ankara 3D</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 100'%3E%3Cg fill='%23b3261e'%3E%3Crect x='19' y='1' width='2' height='9'/%3E%3Cpath d='M15 11h10l-1.5 5h-7z'/%3E%3Cpath fill-rule='evenodd' d='M12 20h16q7 0 7 7t-7 7H12q-7 0-7-7t7-7zM5 24h30v2.5H5zM5 29h30v2.5H5z'/%3E%3Cpath d='M16 34h8l2 62H14z'/%3E%3Crect x='12' y='96' width='16' height='3'/%3E%3C/g%3E%3C/svg%3E" />
  <link rel="stylesheet" href="https://js.arcgis.com/4.32/esri/themes/light/main.css" />
  <script src="https://js.arcgis.com/4.32/"></script>
  <link rel="stylesheet" href="css/uygulama.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" sizes="180x180" href="ikon/atakule-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ankara 3D" />
</head>
<body>
  <!-- Harita: bütün ekran -->
  <div id="viewDiv"></div>

  <!-- Üst çubuk: logo + başlık + arama -->
  <header class="ust-cubuk">
    <a class="ust-bant__logo" href="#" aria-label="Ankara 3D">
      <svg role="img" aria-label="Atakule" viewBox="0 0 40 100" class="atakule-simge"><g fill=\"#b3261e\"><rect x="19" y="1" width="2" height="9"/><path d="M15 11h10l-1.5 5h-7z"/><path fill-rule="evenodd" d="M12 20h16q7 0 7 7t-7 7H12q-7 0-7-7t7-7zM5 24h30v2.5H5zM5 29h30v2.5H5z"/><path d="M16 34h8l2 62H14z"/><rect x="12" y="96" width="16" height="3"/></g></svg>
      <span class="ust-bant__baslik">Ankara 3D</span>
    </a>
    <div class="arama-kapsayici">
      <input type="search" id="arama-girdi" placeholder="Adres ara" aria-label="Adres ara" autocomplete="off" />
      <div id="arama-sonuclari" class="arama-sonuclari" hidden></div>
    </div>
  </header>

  <!-- Katmanlar kartı (araç çubuğunun üstünde açılır) -->
  <div id="katman-karti" class="katman-karti" hidden>
    <label class="katman-satir"><input type="checkbox" id="cb-binalar" checked /> <span>3B Binalar</span></label>
    <label class="katman-satir"><input type="checkbox" id="cb-yapilar" checked /> <span>Yapılar</span></label>
    <label class="katman-satir"><input type="checkbox" id="cb-numarataj" checked /> <span>Numarataj</span></label>
    <label class="katman-satir"><input type="checkbox" id="cb-mahalleler" /> <span>Mahalleler</span></label>
    <label class="katman-satir"><input type="checkbox" id="cb-yollar" /> <span>Yollar</span></label>
    <div class="taban-secimi" role="radiogroup" aria-label="Harita tabanı">
      <button type="button" class="taban-dugme aktif" data-taban="hybrid" aria-pressed="true">Uydu</button>
      <button type="button" class="taban-dugme" data-taban="streets-vector" aria-pressed="false">Harita</button>
    </div>
  </div>

  <!-- Alt araç çubuğu -->
  <nav class="arac-cubugu" aria-label="Harita araçları">
    <button type="button" class="arac-dugme" id="btn-konum" aria-label="Konumumu bul">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>
      <span>Konum</span>
    </button>
    <button type="button" class="arac-dugme" id="btn-anitkabir" aria-label="Anıtkabir'e dön">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V10l7-6 7 6v11M9 21v-7h6v7"/></svg>
      <span>Anıtkabir</span>
    </button>
    <button type="button" class="arac-dugme" id="btn-katmanlar" aria-label="Katmanlar" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
      <span>Katmanlar</span>
    </button>
    <button type="button" class="arac-dugme" id="btn-kuzey" aria-label="Kuzeye çevir">
      <svg id="kuzey-simge" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l5 18-5-4-5 4z"/></svg>
      <span>Kuzey</span>
    </button>
  </nav>

  <!-- Masaüstü durum satırı (telefonda gizli) -->
  <div class="durum-satiri" id="durum-satiri" aria-hidden="true"></div>

  <!-- Bildirim -->
  <div id="bildirim" class="bildirim" hidden></div>

  <!-- Yükleniyor göstergesi -->
  <div id="yukleniyor" class="yukleniyor">
    <svg role="img" aria-label="Atakule" viewBox="0 0 40 100" class="atakule-simge yukleniyor-logo"><g fill=\"#b3261e\"><rect x="19" y="1" width="2" height="9"/><path d="M15 11h10l-1.5 5h-7z"/><path fill-rule="evenodd" d="M12 20h16q7 0 7 7t-7 7H12q-7 0-7-7t7-7zM5 24h30v2.5H5zM5 29h30v2.5H5z"/><path d="M16 34h8l2 62H14z"/><rect x="12" y="96" width="16" height="3"/></g></svg>
    <div class="yukleniyor-halka"></div>
  </div>

  <script src="js/uygulama.js"></script>
</body>
</html>

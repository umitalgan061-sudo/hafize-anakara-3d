<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Ankara 3D" />
  <title>Ankara 3D</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 100'%3E%3Cg fill='%23b3261e'%3E%3Crect x='19' y='1' width='2' height='9'/%3E%3Cpath d='M15 11h10l-1.5 5h-7z'/%3E%3Cpath fill-rule='evenodd' d='M12 20h16q7 0 7 7t-7 7H12q-7 0-7-7t7-7zM5 24h30v2.5H5zM5 29h30v2.5H5z'/%3E%3Cpath d='M16 34h8l2 62H14z'/%3E%3Crect x='12' y='96' width='16' height='3'/%3E%3C/g%3E%3C/svg%3E" />
  <link rel="stylesheet" href="https://js.arcgis.com/4.32/esri/themes/light/main.css" />
  <script src="https://js.arcgis.com/4.32/"></script>
  <link rel="stylesheet" href="css/uygulama.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" sizes="180x180" href="ikon/atakule-180.png" />
</head>
<body>
  <div id="viewDiv"></div>
  <div id="yukleniyor" class="yukleniyor" aria-hidden="true">
    <svg viewBox="0 0 40 100" class="yukleniyor__logo"><g fill="#b3261e"><rect x="19" y="1" width="2" height="9"/><path d="M15 11h10l-1.5 5h-7z"/><path fill-rule="evenodd" d="M12 20h16q7 0 7 7t-7 7H12q-7 0-7-7t7-7zM5 24h30v2.5H5zM5 29h30v2.5H5z"/><path d="M16 34h8l2 62H14z"/><rect x="12" y="96" width="16" height="3"/></g></svg>
    <span class="yukleniyor__halka"></span>
  </div>

  <header class="ust-bant">
    <a class="ust-bant__logo" href="#" aria-label="Ankara 3D">
      <svg role="img" aria-label="Atakule" viewBox="0 0 40 100"><g fill="#b3261e"><rect x="19" y="1" width="2" height="9"/><path d="M15 11h10l-1.5 5h-7z"/><path fill-rule="evenodd" d="M12 20h16q7 0 7 7t-7 7H12q-7 0-7-7t7-7zM5 24h30v2.5H5zM5 29h30v2.5H5z"/><path d="M16 34h8l2 62H14z"/><rect x="12" y="96" width="16" height="3"/></g></svg>
      <span class="ust-bant__baslik">Ankara 3D</span>
    </a>
    <div class="arama-kutu">
      <input type="search" id="arama-girdi" placeholder="Adres ara" aria-label="Adres ara" autocomplete="off" enterkeyhint="search" />
      <button type="button" id="arama-temizle" aria-label="Aramayı temizle" title="Temizle" hidden>✕</button>
      <div id="arama-sonuclari" class="arama-sonuclari" hidden></div>
    </div>
  </header>

  <div class="alt-cubuk" role="group" aria-label="Harita kontrolleri">
    <button type="button" class="kontrol-dugme" id="btn-konum" aria-label="Konumumu bul" title="Konumumu bul">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>
      <span>Konum</span>
    </button>
    <button type="button" class="kontrol-dugme" id="btn-anitkabir" aria-label="Anıtkabir'e dön" title="Anıtkabir'e dön">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V10l7-6 7 6v11"/><path d="M9 21v-6h6v6"/></svg>
      <span>Anıtkabir</span>
    </button>
    <button type="button" class="kontrol-dugme" id="btn-katmanlar" aria-label="Katmanlar" title="Katmanlar" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 12 12 17 22 12"/><polyline points="2 17 12 22 22 17"/></svg>
      <span>Katmanlar</span>
    </button>
    <button type="button" class="kontrol-dugme" id="btn-kuzey" aria-label="Kuzeye çevir" title="Kuzeye çevir">
      <svg id="kuzey-simge" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 3 19 21 12 17 5 21 12 3"/></svg>
      <span>Kuzey</span>
    </button>
  </div>

  <div class="katman-karti" id="katman-karti" hidden>
    <label class="katman-satir"><input type="checkbox" id="cb-binalar" checked /> 3B Binalar</label>
    <label class="katman-satir"><input type="checkbox" id="cb-yapilar" checked /> Yapılar</label>
    <label class="katman-satir"><input type="checkbox" id="cb-numarataj" checked /> Numarataj</label>
    <label class="katman-satir"><input type="checkbox" id="cb-mahalleler" /> Mahalleler</label>
    <label class="katman-satir"><input type="checkbox" id="cb-yollar" /> Yollar</label>
    <div class="taban-secimi">
      <button type="button" class="taban-dugme" id="taban-uydu" aria-pressed="true">Uydu</button>
      <button type="button" class="taban-dugme" id="taban-harita" aria-pressed="false">Harita</button>
    </div>
  </div>

  <div id="bildirim" class="bildirim" role="status" aria-live="polite" hidden></div>
  <div id="duyuru" class="gorsel-gizli" role="status" aria-live="polite"></div>
  <div class="durum-satiri" id="durum-satiri" aria-hidden="true"></div>

  <script src="js/uygulama.js"></script>
</body>
</html>

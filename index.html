<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ankara 3D Harita</title>
  <!-- Inter font (jsdelivr) - sabit sürüm -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5.1.0/latin.css" />
  <!-- ArcGIS API for JavaScript 4.32 -->
  <link rel="stylesheet" href="https://js.arcgis.com/4.32/esri/themes/light/main.css" />
  <script src="https://js.arcgis.com/4.32/"></script>
  <!-- Proje stilleri -->
  <link rel="stylesheet" href="css/tasarim.css" />
</head>
<body>
  <!-- Harita tam ekran -->
  <div id="viewDiv"></div>

  <!-- Üst ortada yüzen arama kartı -->
  <div class="kart" id="arama-karti" role="search" aria-label="Adres arama">
    <form id="arama-form" class="kart-icerik">
      <input type="text" id="arama-girdi" placeholder="Adres, cadde, mahalle, ilçe..." autocomplete="off" aria-label="Arama terimi" />
      <button type="submit" id="arama-btn" aria-label="Ara">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </button>
    </form>
  </div>

  <!-- Sol katlanabilir katman kartı (masaüstü) / Bottom sheet (mobil) -->
  <div class="kart" id="katman-karti" role="region" aria-label="Harita katmanları">
    <div id="katman-baslik" tabindex="0" role="button" aria-expanded="true" aria-controls="katman-icerik">
      <h2>Katmanlar</h2>
      <button id="katman-ac-kapa" aria-label="Katman listesini genişlet/daralt">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
    </div>
    <div id="katman-icerik" role="list">
      <div class="katman-satiri" role="listitem">
        <input type="checkbox" id="cb_binalar" checked />
        <label for="cb_binalar">Esri 3D Binalar</label>
      </div>
      <div class="katman-satiri" role="listitem">
        <input type="checkbox" id="cb_mahalle" checked />
        <label for="cb_mahalle">Mahalle</label>
      </div>
      <div class="katman-satiri" role="listitem">
        <input type="checkbox" id="cb_yol" checked />
        <label for="cb_yol">Yol</label>
      </div>
      <div class="katman-satiri" role="listitem">
        <input type="checkbox" id="cb_yapi" checked />
        <label for="cb_yapi">Yapı</label>
      </div>
      <div class="katman-satiri" role="listitem">
        <input type="checkbox" id="cb_ilce" checked />
        <label for="cb_ilce">İlçe</label>
      </div>
      <hr style="margin:10px 0; border:none; border-top:1px solid rgba(148,163,184,0.12);" />
      <div style="font-size:0.75rem; color:var(--renk-metin-solgun); padding:0 4px;">Harita Tabanı</div>
      <div id="taban-listesi" class="taban-grup" role="radiogroup" aria-label="Harita tabanı seçimi">
        <button type="button" class="taban-btn aktif" data-taban="hybrid" role="radio" aria-checked="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><path d="M3 9h18M9 3v18"></path></svg>Karma (Uydu+Etiket)</button>
        <button type="button" class="taban-btn" data-taban="satellite" role="radio" aria-checked="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10"></path></svg>Sadece Uydu</button>
        <button type="button" class="taban-btn" data-taban="streets" role="radio" aria-checked="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>Yol Haritası</button>
        <button type="button" class="taban-btn" data-taban="gray" role="radio" aria-checked="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="12" x2="21" y2="12"></line><line x1="12" y1="3" x2="12" y2="21"></line></svg>Gri</button>
      </div>
    </div>
    <!-- Mobil sürükle çubuğu -->
    <div class="surukle-cubuk" aria-hidden="true"></div>
  </div>
  <!-- Mobil overlay -->
  <div id="katman-overlay" class="gizli" aria-hidden="true"></div>

  <!-- Sağ alt yüzen eylem düğmeleri -->
  <div class="kart" id="eylemler" role="group" aria-label="Harita eylemleri">
    <button class="eylem-btn" id="btn-katmanlar" aria-label="Katmanları aç/kapat" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
    </button>
    <button class="eylem-btn" id="btn-taban" aria-label="Harita tabanını değiştir">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
    </button>
    <button class="eylem-btn" id="btn-konum" aria-label="Konumumu bul">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2"></path></svg>
    </button>
    <button class="eylem-btn" id="btn-tema" aria-label="Tema değiştir" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
    </button>
  </div>

  <!-- Footer koordinat/zoom (sade, köşede) -->
  <div class="kart" style="bottom:16px; left:16px; right:auto; top:auto; padding:8px 12px; font-size:0.75rem; color:var(--renk-metin-solgun); pointer-events:none; z-index:50;">
    Koordinat: <span id="coord">--</span> | Ölçek: <span id="zoom">--</span>
  </div>

  <!-- Toast konteyneri -->
  <div id="toast-konteyner" aria-live="polite" aria-atomic="true"></div>

  <!-- Uygulama mantığı -->
  <script src="js/arayuz.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ankara 3D Harita & Arayüz</title>
  <!-- ArcGIS API for JavaScript -->
  <link rel="stylesheet" href="https://js.arcgis.com/4.32/esri/themes/light/main.css" />
  <style>
    /* --- GLOBAL BAŞLANGIÇ --- */
    :root {
      --bg: #fafafa;
      --panel-bg: #ffffff;
      --text: #212529;
      --accent: #0078d4;
      --accent-hover: #005fa3;
      --warning: #d9534f;
      --success: #28a745;
      --radius: 8px;
      --shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    * { box-sizing: border-box; }
    html, body, #viewDiv { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-hover); }

    /* --- HEADER (Arama + Profil) --- */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: var(--panel-bg);
      border-bottom: 1px solid #e5e5e5;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header h1 { margin: 0; font-size: 1.2rem; font-weight: 600; }
    .search-wrapper {
      flex: 1;
      max-width: 400px;
      margin: 0 20px;
      display: flex;
    }
    .search-wrapper input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: var(--radius) 0 0 var(--radius);
      font-size: 0.9rem;
      outline: none;
    }
    .search-wrapper button {
      padding: 0 16px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 0 var(--radius) var(--radius) 0;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .search-wrapper button:hover { background: var(--accent-hover); }

    /* Hamburger (mobil) */
    .hamburger {
      display: none;
      flex-direction: column;
      justify-content: space-between;
      width: 28px;
      height: 20px;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0;
      z-index: 110;
    }
    .hamburger span {
      display: block;
      width: 100%;
      height: 3px;
      background: var(--text);
      border-radius: 2px;
      transition: transform 0.3s, opacity 0.3s;
    }
    .hamburger.open span:nth-child(1) { transform: translateY(8.5px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-8.5px) rotate(-45deg); }

    /* --- SIDEBAR (Sol Panel) --- */
    .sidebar {
      width: 260px;
      background: var(--panel-bg);
      padding: 20px;
      height: 100%;
      box-shadow: 2px 0 6px rgba(0,0,0,0.08);
      border-right: 1px solid #e5e5e5;
      display: flex;
      flex-direction: column;
      position: fixed;
      left: 0;
      top: 64px; /* header height approx */
      bottom: 48px; /* footer height approx */
      z-index: 200;
      transform: translateX(-100%);
      transition: transform 0.3s ease;
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar h2 { margin-top: 0; margin-bottom: 15px; font-size: 1rem; color: #555; }
    .sidebar .layer-panel, .sidebar .basemap-panel {
      background: #f9f9f9;
      padding: 10px;
      border-radius: var(--radius);
      margin-bottom: 10px;
      overflow-y: auto;
      max-height: 300px;
    }
    .sidebar .layer-panel h3, .sidebar .basemap-panel h3 { margin: 0 0 8px; font-size: 0.85rem; color: #777; }
    .sidebar .layer-list label { display: block; margin: 4px 0; font-size: 0.8rem; }
    .sidebar .layer-list input[type="checkbox"] { margin-right: 5px; transform: scale(0.8); }
    .sidebar .basemap-list button {
      width: 100%;
      padding: 6px;
      margin: 4px 0;
      background: transparent;
      border: 1px solid #ddd;
      border-radius: var(--radius);
      font-size: 0.8rem;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s;
    }
    .sidebar .basemap-list button:hover { background: #eef; }

    /* Sidebar overlay (mobilde arka planı karart) */
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 150;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .sidebar-overlay.visible { display: block; opacity: 1; }

    /* --- MAIN CONTENT (Harita + Kontroller) --- */
    #content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #viewDiv { width: 100%; height: 100%; background: #000; } /* 3D arka plan */

    /* --- LAYOUT: Sol Harita + Sağ Kontroller --- */
    .layout {
      display: flex;
      height: calc(100vh - 160px); /* Header + Footer hesaba kat */
    }
    .map-area { flex: 1; padding: 20px; overflow: auto; }
    .controls {
      padding: 15px 20px;
      background: var(--panel-bg);
      border-left: 1px solid #e5e5e5;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .control-btn {
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: var(--radius);
      background: #fff;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .control-btn:hover { border-color: var(--accent); background: #f0f8ff; }
    .control-btn.active { border-color: var(--accent); background: var(--accent); color: white; }

    /* --- SAĞ ALTA KONUM BUTONU (Floating) --- */
    .locate-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
      width: 56px; height: 56px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform 0.2s, background 0.2s;
    }
    .locate-btn:hover { background: var(--accent-hover); transform: scale(1.1); }
    .locate-btn:active { transform: scale(0.95); }

    /* --- FOOTER (Koordinat/info) --- */
    footer {
      padding: 8px 20px;
      background: var(--panel-bg);
      border-top: 1px solid #e5e5e5;
      font-size: 0.75rem;
      color: #777;
      display: flex;
      justify-content: space-between;
    }

    /* --- TOAST BİLDİRİM --- */
    #toast-container {
      position: fixed;
      top: 80px;
      right: 20px;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      background: #333;
      color: #fff;
      padding: 12px 16px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      font-size: 0.85rem;
      max-width: 320px;
      animation: slideIn 0.3s ease, fadeOut 0.5s 3.5s forwards;
      pointer-events: auto;
      border-left: 4px solid var(--warning);
    }
    .toast.success { border-left-color: var(--success); }
    .toast.info { border-left-color: var(--accent); }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes fadeOut { to { opacity: 0; transform: translateX(100%); } }

    /* --- RESPONSIVE --- */
    @media (max-width: 768px) {
      .hamburger { display: flex; }
      .sidebar { display: flex; }
      .layout { flex-direction: column; }
      .controls { order: -1; } /* Mobilde en üste */
    }
  </style>
</head>
<body>

<header>
  <button class="hamburger" id="hamburger" onclick="toggleSidebar()" aria-label="Menüyü aç/kapat" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
  <h1>Ankara 3D Harita</h1>
  <form class="search-wrapper" onsubmit="event.preventDefault(); searchLocation()">
    <input type="text" id="searchInput" placeholder="Adres, cadde, ilçe..." />
    <button type="submit">Ara</button>
  </form>
</header>

<div id="content">
  <div class="layout">
    <!-- SOL: Çubuğu genişletilebilir kategori listesi -->
    <aside class="sidebar" id="sidebar">
      <h2>3D Harita Katmanları</h2>
      <div class="layer-panel">
        <div class="layer-list">
          <label><input type="checkbox" id="cb_buildings" checked> Esri 3D Binalar</label>
          <label><input type="checkbox" id="cb_mahalle" checked> Mahalle</label>
          <label><input type="checkbox" id="cb_cadde" checked> Yol</label>
          <label><input type="checkbox" id="cb_yapi1" checked> Yapı</label>
          <label><input type="checkbox" id="cb_yapi2" checked> İlçe</label>
        </div>
      </div>
      <div class="basemap-panel">
        <h3>Harita Tabanı</h3>
        <div class="basemap-list">
          <button data-basemap="hybrid">Karma (Uydu+Etiket)</button>
          <button data-basemap="satellite">Sadece Uydu</button>
          <button data-basemap="streets">Yol Haritası</button>
          <button data-basemap="gray">Gri</button>
        </div>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

    <!-- ORTA: 3D Harita Alanı -->
    <main class="map-area">
      <div id="viewDiv"></div>
    </main>

    <!-- SAĞ: Kontroller -->
    <aside class="controls" id="controls">
      <button class="control-btn" onclick="toggleLayers()">Katmanları Aç/Kapa</button>
      <button class="control-btn active" onclick="cycleBasemap()">Taban Değiştir</button>
      <div style="margin-top:auto;">
        <button class="locate-btn" onclick="locateUser()">📍 Konum</button>
      </div>
    </aside>
  </div>
</div>

<footer>
  <span>Koordinat: <span id="coord">--</span></span>
  <span>Ölçek: <span id="zoom">--</span></span>
</footer>

<div id="toast-container"></div>

<script src="https://js.arcgis.com/4.32/"></script>
<script>
  // --- ArcGIS Harita Başlatma ---
  let map, view;
  require([
    "esri/Map", "esri/views/SceneView",
    "esri/layers/SceneLayer", "esri/layers/FeatureLayer",
    "esri/renderers/SimpleRenderer", "esri/symbols/MeshSymbol3D", "esri/symbols/edges/SketchEdges3D",
    "esri/Graphic", "esri/PopupTemplate"
  ], function(Map, SceneView, SceneLayer, FeatureLayer, SimpleRenderer, MeshSymbol3D, SketchEdges3D, Graphic, PopupTemplate) {
    map = new Map({ basemap: "hybrid" });

    // PopupTemplate yardımcı fonksiyonu
    function makePopup(titleField, fieldInfos) {
      return new PopupTemplate({
        title: "{*" + titleField + "}",
        content: fieldInfos.map(f => `<b>${f.label}:</b> {${f.fieldName}}`).join("<br>"),
        fieldInfos: fieldInfos.map(f => ({ fieldName: f.fieldName, visible: true }))
      });
    }

    // 1) Binalar - Taralı Buz Rengi Kenarları
    const buildings = new SceneLayer({
      url: "https://basemaps3d.arcgis.com/arcgis/rest/services/Esri3D_Buildings_v1/SceneServer",
      popupTemplate: new PopupTemplate({ title: "3D Bina", content: "Esri 3D Buildings katmanı" })
    });
    buildings.renderer = new SimpleRenderer({
      symbol: new MeshSymbol3D({
        symbolLayers: [{
          type: "fill",
          material: { color: [255,255,255,0] },
          edges: new SketchEdges3D({ color: [173,216,230,1], size: 2 })
        }]
      })
    });

    // 2) Adres Katmanları (MapServer) - baskentcbs.ankara.bel.tr (herkese açık)
    const adres1 = new FeatureLayer({
      url: "https://baskentcbs.ankara.bel.tr/server/rest/services/ortak/adres/MapServer/3",
      title: "Mahalle", outFields: ["*"],
      popupTemplate: makePopup("MAHALLE_ADI", [
        { label: "Mahalle", fieldName: "MAHALLE_ADI" },
        { label: "İlçe", fieldName: "ILCE_ADI" }
      ])
    });
    const adres2 = new FeatureLayer({
      url: "https://baskentcbs.ankara.bel.tr/server/rest/services/ortak/adres/MapServer/1",
      title: "Yol", outFields: ["*"],
      popupTemplate: makePopup("CADDE_ADI", [
        { label: "Cadde/Sokak", fieldName: "CADDE_ADI" },
        { label: "Mahalle", fieldName: "MAHALLE_ADI" },
        { label: "İlçe", fieldName: "ILCE_ADI" }
      ])
    });
    const yapi1 = new FeatureLayer({
      url: "https://baskentcbs.ankara.bel.tr/server/rest/services/ortak/adres/MapServer/2",
      title: "Yapı", outFields: ["*"],
      popupTemplate: makePopup("YAPI_ADI", [
        { label: "Yapı", fieldName: "YAPI_ADI" },
        { label: "Mahalle", fieldName: "MAHALLE_ADI" },
        { label: "İlçe", fieldName: "ILCE_ADI" }
      ])
    });
    const yapi2 = new FeatureLayer({
      url: "https://baskentcbs.ankara.bel.tr/server/rest/services/ortak/adres/MapServer/4",
      title: "İlçe", outFields: ["*"],
      popupTemplate: makePopup("ILCE_ADI", [
        { label: "İlçe", fieldName: "ILCE_ADI" }
      ])
    });

    map.addMany([buildings, adres1, adres2, yapi1, yapi2]);

    // Toast bildirimi yardımcı
    function showToast(msg, type = "warning") {
      const container = document.getElementById("toast-container");
      const toast = document.createElement("div");
      toast.className = "toast " + type;
      toast.textContent = msg;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 4000);
    }

    // Katman yüklenemezse ilgili checkbox'ı devre dışı bırak + toast
    const layerErrs = {
      cb_buildings: buildings,
      cb_mahalle: adres1,
      cb_cadde: adres2,
      cb_yapi1: yapi1,
      cb_yapi2: yapi2
    };
    Object.entries(layerErrs).forEach(([id, layer]) => {
      layer.when(null, (err) => {
        const cb = document.getElementById(id);
        if (cb) {
          cb.disabled = true;
          cb.parentElement.appendChild(document.createTextNode(" (erişilemiyor)"));
        }
        showToast("Katman yüklenemedi: " + layer.title, "warning");
        console.warn("Katman yüklenemedi (" + id + ")", err);
      });
    });

    view = new SceneView({
      container: "viewDiv",
      map: map,
      camera: { position: { x: 32.8597, y: 39.9334, z: 4500 }, tilt: 65 }
    });

    // --- Dinamik Güncellemeler ---

    // Katman Göster/Gizle
    function toggleLayers() {
      const layers = map.layers.items;
      let anyVisible = false;
      layers.forEach(layer => {
        const newVis = !layer.visible;
        layer.visible = newVis;
        if (newVis) anyVisible = true;
      });
      const btn = document.querySelector('.controls .control-btn[onclick="toggleLayers()"]');
      if (btn) btn.classList.toggle('active', anyVisible);
    }

    // Basemap Değiştir
    function changeBasemap(name) {
      map.basemap = name;
      document.querySelectorAll('.basemap-list button').forEach(b => b.classList.toggle('active', b.dataset.basemap === name));
    }

    // Taban butonları döngüsü: hybrid > satellite > streets > gray
    function cycleBasemap() {
      const order = ['hybrid', 'satellite', 'streets', 'gray'];
      const current = map.basemap?.id;
      const idx = order.indexOf(current);
      const next = order[(idx + 1) % order.length];
      changeBasemap(next);
    }

    // Konumu Bul (Geolocation)
    function locateUser() {
      if (!navigator.geolocation) {
        showToast("Tarayıcı GPS desteklemiyor.", "warning");
        return;
      }
      navigator.geolocation.getCurrentPosition((pos) => {
        const { latitude, longitude } = pos.coords;
        view.goTo({ latitude, longitude, heading: 0, tilt: 65 });
        view.graphics.removeAll();
        view.graphics.add(new Graphic({
          geometry: { type: "point", longitude, latitude },
          symbol: { type: "simple-marker", color: [0, 120, 212], size: 12 }
        }));
        showToast("Konum bulundu", "success");
      }, (err) => {
        showToast("Konum erişimi reddedildi ya da hata: " + err.message, "warning");
      });
    }

    // Arama Fonksiyonu - ArcGIS World Geocoding Service (çoklu sonuç)
    function searchLocation() {
      const val = document.getElementById("searchInput").value;
      if (!val) return showToast("Lütfen bir adres girin.", "warning");
      fetch('https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates?f=json&maxLocations=10&countryCode=TUR&SingleLine=' + encodeURIComponent(val + ', Ankara'))
        .then(r => r.json())
        .then(data => {
          const candidates = data.candidates || [];
          if (candidates.length === 0) {
            showToast("Sonuç bulunamadı", "warning");
            return;
          }
          if (candidates.length === 1) {
            const c = candidates[0];
            const pt = { type: "point", longitude: c.location.x, latitude: c.location.y };
            view.popup.open({ location: pt, title: "Arama Sonucu", content: c.address });
            view.goTo({ target: pt, zoom: 16, tilt: 65 });
            document.getElementById("coord").innerText = c.address;
            showToast("Adres bulundu", "success");
            return;
          }
          // Birden fazla sonuç: popup'a liste bas
          const listHtml = candidates.map((c, i) => `
            <label style="display:block; padding:8px; border-bottom:1px solid #eee; cursor:pointer;">
              <input type="radio" name="searchResult" value="${i}" ${i===0?'checked':''} style="margin-right:8px;">
              <strong>${c.address}</strong>
            </label>
          `).join('');
          const first = candidates[0];
          const pt = { type: "point", longitude: first.location.x, latitude: first.location.y };
          view.popup.open({
            location: pt,
            title: `${candidates.length} sonuç bulundu`,
            content: `<div style="max-height:200px; overflow:auto;">${listHtml}</div>
              <button onclick="selectSearchResult()" style="margin-top:8px; width:100%; padding:8px; background:var(--accent); color:white; border:none; border-radius:4px; cursor:pointer;">Seç ve Git</button>`
          });
          // Seçimi sakla
          window._searchCandidates = candidates;
        })
        .catch(err => {
          console.error(err);
          showToast("Arama hatası: " + err.message, "warning");
        });
    }

    // Popup'taki listeden seçim yapıp git
    function selectSearchResult() {
      const radios = document.querySelectorAll('input[name="searchResult"]');
      let idx = 0;
      radios.forEach((r, i) => { if (r.checked) idx = i; });
      const c = window._searchCandidates[idx];
      const pt = { type: "point", longitude: c.location.x, latitude: c.location.y };
      view.popup.open({ location: pt, title: "Arama Sonucu", content: c.address });
      view.goTo({ target: pt, zoom: 16, tilt: 65 });
      document.getElementById("coord").innerText = c.address;
      showToast("Adres seçildi", "success");
    }

    // --- Koordinat ve Zoom Güncelleme (Footer) ---
    view.watch("scale", function(newScale) {
      document.getElementById("zoom").innerText = Math.round(newScale);
    });
    view.on("target-change", function() {
      const center = view.center;
      document.getElementById("coord").innerText = `${center.latitude?.toFixed(4)}, ${center.longitude?.toFixed(4)}`;
    });

    console.log("Harita ve kontroller hazır.");

    const cbMap = {
      cb_buildings: buildings,
      cb_mahalle: adres1,
      cb_cadde: adres2,
      cb_yapi1: yapi1,
      cb_yapi2: yapi2
    };

    // Harita katmanı görünürlüğü değiştiğinde checkbox'ı güncelle
    Object.entries(cbMap).forEach(([id, layer]) => {
      layer.watch("visible", (vis) => {
        const cb = document.getElementById(id);
        if (cb) cb.checked = vis;
      });
    });

    // Checkbox değiştiğinde harita katmanını güncelle
    Object.keys(cbMap).forEach(id => {
      const cb = document.getElementById(id);
      if (cb) cb.addEventListener("change", () => {
        cbMap[id].visible = cb.checked;
      });
    });

    // Başlangıçta checkbox'ları mevcut layer.visible ile eşitle
    Object.entries(cbMap).forEach(([id, layer]) => {
      const cb = document.getElementById(id);
      if (cb) cb.checked = layer.visible;
    });

    // Taban butonlarına (data-basemap) tıklama olayı
    document.querySelectorAll('.basemap-list button').forEach(b => {
      b.addEventListener('click', () => changeBasemap(b.dataset.basemap));
    });

    // Arama kutusuna Enter desteği
    document.getElementById("searchInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") searchLocation();
    });

    // Mobil sidebar toggle
    function toggleSidebar() {
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("sidebarOverlay");
      const hamburger = document.getElementById("hamburger");
      const isOpen = sidebar.classList.toggle("open");
      overlay.classList.toggle("visible", isOpen);
      hamburger.classList.toggle("open", isOpen);
      hamburger.setAttribute("aria-expanded", isOpen);
    }
    function closeSidebar() {
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("sidebarOverlay");
      const hamburger = document.getElementById("hamburger");
      sidebar.classList.remove("open");
      overlay.classList.remove("visible");
      hamburger.classList.remove("open");
      hamburger.setAttribute("aria-expanded", "false");
    }

    // Fonksiyonları global alana taşı (onclick'ler için)
    Object.assign(window, { toggleLayers, changeBasemap, locateUser, searchLocation, cycleBasemap, selectSearchResult, toggleSidebar, closeSidebar });
  });
</script>

</body>
</html>

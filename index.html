<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="color-scheme" content="light" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Ankara 3D" />
  <meta name="description" content="Ankara 3D — Anıtkabir görünümüyle açılan tek ekran 3B Ankara haritası; bina, adres ve mahalle katmanları." />
  <title>Ankara 3D</title>
  <!-- İlk açılış performansı: ana servislerin DNS/TLS el sıkışması erkenden başlasın -->
  <link rel="preconnect" href="https://js.arcgis.com" crossorigin />
  <link rel="preconnect" href="https://server.arcgisonline.com" crossorigin />
  <link rel="preconnect" href="https://basemaps3d.arcgis.com" crossorigin />
  <link rel="preconnect" href="https://basemaps.arcgis.com" crossorigin />
  <link rel="preconnect" href="https://geocode.arcgis.com" crossorigin />
  <link rel="preconnect" href="https://baskentcbs.ankara.bel.tr" crossorigin />
  <!-- preconnect desteklemeyen eski tarayıcılar için DNS çözümlemesi erkenden başlasın (kritik veri + 3B bina servisleri) -->
  <link rel="dns-prefetch" href="https://baskentcbs.ankara.bel.tr" />
  <link rel="dns-prefetch" href="https://basemaps3d.arcgis.com" />
  <link rel="dns-prefetch" href="https://js.arcgis.com" />
  <link rel="dns-prefetch" href="https://server.arcgisonline.com" />
  <link rel="dns-prefetch" href="https://basemaps.arcgis.com" />
  <link rel="dns-prefetch" href="https://geocode.arcgis.com" />
  <!-- Yükleme zincirinin ilk halkaları (Numarataj → Yapılar) için servis ve katman meta verisi erkenden çekilir; AMD yükleyici çalıştığında istek zaten tamamlanmış olur (ilk açılış <2 sn hedefine katkı) -->
  <link rel="preload" as="fetch" crossorigin fetchpriority="high" href="https://baskentcbs.ankara.bel.tr/server/rest/services/ortak/adres/MapServer?f=json" />
  <link rel="preload" as="fetch" crossorigin fetchpriority="high" href="https://baskentcbs.ankara.bel.tr/server/rest/services/ortak/adres/MapServer/0?f=json" />
  <link rel="preload" as="fetch" crossorigin fetchpriority="high" href="https://baskentcbs.ankara.bel.tr/server/rest/services/ortak/adres/MapServer/2?f=json" />
  <!-- Zincirin SON halkası (3B binalar) view.when + requestIdleCallback ile erteleniyor;
       SceneServer meta verisi yine de erkenden çekilir — idle callback tetiklenince istek
       çoktan tamamlanmış olur, açılış Anıtkabir görünümü <2 sn hedefini geciktirmez -->
  <link rel="preload" as="fetch" crossorigin fetchpriority="high" href="https://basemaps3d.arcgis.com/arcgis/rest/services/Esri3D_Buildings_v1/SceneServer?f=json" />
  <!-- Açılış görünümü (Anıtkabir, z16 merkez) için yalnızca en kritik 4 uydu karo erkenden çekilir; fazlası sw.js karo önbelleğinden gelir -->
  <link rel="preload" as="image" crossorigin fetchpriority="high" href="https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/16/24834/38746" />
  <link rel="preload" as="image" crossorigin fetchpriority="high" href="https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/16/24834/38747" />
  <link rel="preload" as="image" crossorigin fetchpriority="high" href="https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/16/24835/38746" />
  <link rel="preload" as="image" crossorigin fetchpriority="high" href="https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/16/24835/38747" />
  <!-- Çevrimdışı 'Harita' (streets-vector) taban geçişi için vektör taban kaynakları erkenden başlar:
       stil kökü (root.json) + sprite + glyph aralığı + font preload edilir; sw.js bunları önbelleğe alır -->
  <link rel="preload" as="fetch" crossorigin fetchpriority="high" href="https://basemaps.arcgis.com/arcgis/rest/services/World_Street_Map/VectorTileServer?f=json" />
  <link rel="preload" as="fetch" crossorigin fetchpriority="high" href="https://basemaps.arcgis.com/arcgis/rest/services/World_Street_Map/VectorTileServer/resources/styles/root.json" />
  <link rel="preload" as="fetch" crossorigin fetchpriority="high" href="https://basemaps.arcgis.com/arcgis/rest/services/World_Street_Map/VectorTileServer/resources/sprites/sprite.json" />
  <link rel="preload" as="fetch" crossorigin href="https://basemaps.arcgis.com/arcgis/rest/services/World_Street_Map/VectorTileServer/resources/fonts/AdelleSans_W_Bold/0-255.pbf" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 100'%3E%3Cg fill='%23b3261e'%3E%3Crect x='19' y='1' width='2' height='9'/%3E%3Cpath d='M15 11h10l-1.5 5h-7z'/%3E%3Cpath fill-rule='evenodd' d='M12 20h16q7 0 7 7t-7 7H12q-7 0-7-7t7-7zM5 24h30v2.5H5zM5 29h30v2.5H5z'/%3E%3Cpath d='M16 34h8l2 62H14z'/%3E%3Crect x='12' y='96' width='16' height='3'/%3E%3C/g%3E%3C/svg%3E" />
  <!-- ArcGIS tema CSS'i ilk boyamayı engellemesin: print medyasıyla yükle, yüklenince 'all' yap.
       Ayrı bir fetch preload'u eklenir: sw.js SDK önbelleği tema CSS'ini erkenden ve
       tutarlı şekilde önbelleğe alır; uçak modunda tema önbellekten açılır -->
  <link rel="preload" as="fetch" crossorigin fetchpriority="high" href="https://js.arcgis.com/4.32/esri/themes/light/main.css" />
  <link rel="stylesheet" href="https://js.arcgis.com/4.32/esri/themes/light/main.css" />
  <!-- ArcGIS JS 4.32 ana yükleyici betiğinin tam URL'si preload edilir; bu erken ipucu
       yükleyicinin indirilmesini geciktirmez, tam tersine ilk açılışı hızlandırır.
       sw.js SDK önbelleğiyle tutarlı: kritik esri modülleri de erkenden preload edilir,
       AMD require bu URL'leri istediğinde tarayıcı önbelleği zaten dolu olur -->
  <link rel="preload" as="script" href="https://js.arcgis.com/4.32/" fetchpriority="high" />
  <link rel="preload" as="script" fetchpriority="high" href="https://js.arcgis.com/4.32/init.js" />
  <link rel="preload" as="script" fetchpriority="high" href="https://js.arcgis.com/4.32/esri/views/SceneView.js" />
  <link rel="preload" as="script" fetchpriority="high" href="https://js.arcgis.com/4.32/esri/WebScene.js" />
  <link rel="preload" as="script" fetchpriority="high" href="https://js.arcgis.com/4.32/esri/core/reactiveUtils.js" />
  <script src="https://js.arcgis.com/4.32/" fetchpriority="high"></script>
  <link rel="preload" href="css/uygulama.css" as="style" fetchpriority="high" />
  <link rel="preload" href="js/uygulama.js" as="script" fetchpriority="high" />
  <link rel="stylesheet" href="css/uygulama.css" fetchpriority="high" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" sizes="180x180" href="ikon/atakule-180.png" />
</head>
<body>
  <a class="atla-link" href="#viewDiv">Haritaya geç</a>
  <noscript><p style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center;background:#fff;color:#1f1f1f;font-family:system-ui,sans-serif;">Ankara 3D haritasının çalışması için JavaScript gereklidir.</p></noscript>
  <div id="viewDiv" tabindex="-1" role="application" aria-label="Ankara 3D harita görünümü. Haritada gezinmek için ok tuşlarını, yakınlaşmak için artı ve eksi tuşlarını kullanın; merkezdeki nesneyi seçmek için Enter."></div>
  <!-- Yükleniyor göstergesi: aria değerleri (0-3) js/uygulama.js zinciriyle birebir eşleşir
       (Numarataj 1/3, Yapılar 2/3, 3B binalar 3/3 — yuklemeIlerleme() bu değerleri yazar) -->
  <div id="yukleniyor" class="yukleniyor" role="progressbar" aria-label="Harita yükleniyor" aria-valuemin="0" aria-valuemax="3" aria-valuenow="0" aria-valuetext="Yükleniyor (0/3)">
    <span class="gorsel-gizli">Harita yükleniyor</span>
    <svg viewBox="0 0 40 100" class="yukleniyor__logo" aria-hidden="true" focusable="false"><g fill="#b3261e"><rect x="19" y="1" width="2" height="9"/><path d="M15 11h10l-1.5 5h-7z"/><path fill-rule="evenodd" d="M12 20h16q7 0 7 7t-7 7H12q-7 0-7-7t7-7zM5 24h30v2.5H5zM5 29h30v2.5H5z"/><path d="M16 34h8l2 62H14z"/><rect x="12" y="96" width="16" height="3"/></g></svg>
    <span class="yukleniyor__halka" aria-hidden="true"></span>
  </div>

  <header class="ust-bant" id="ust-bant" aria-label="Üst çubuk: uygulama adı, adres arama ve durum göstergesi">
    <a class="ust-bant__logo" href="#" aria-label="Ankara 3D" style="height:28px;flex:none;display:flex;align-items:center;">
      <svg role="img" aria-label="Atakule" viewBox="0 0 40 100" width="11.2" height="28" preserveAspectRatio="xMidYMid meet" style="height:28px;width:auto;display:block;" focusable="false"><g fill="#b3261e"><rect x="19" y="1" width="2" height="9"/><path d="M15 11h10l-1.5 5h-7z"/><path fill-rule="evenodd" d="M12 20h16q7 0 7 7t-7 7H12q-7 0-7-7t7-7zM5 24h30v2.5H5zM5 29h30v2.5H5z"/><path d="M16 34h8l2 62H14z"/><rect x="12" y="96" width="16" height="3"/></g></svg>
      <h1 class="ust-bant__baslik">Ankara 3D</h1>
    </a>
    <div class="arama-kutu" role="search">
      <input type="search" id="arama-girdi" placeholder="Adres ara" aria-label="Adres ara" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="arama-sonuclari" aria-autocomplete="list" />
      <button type="button" id="arama-temizle" aria-label="Aramayı temizle" title="Temizle" hidden>✕</button>
      <div id="arama-sonuclari" class="arama-sonuclari" role="listbox" aria-label="Arama sonuçları" hidden></div>
    </div>
    <button type="button" class="kurulum-dugme" id="btn-kurulum" hidden aria-label="Uygulamayı ana ekrana kur">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3v12"/><polyline points="7 10 12 15 17 10"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      <span>Kur</span>
    </button>
    <span id="cevrimo-gosterge" class="cevrimo-gosterge" role="status" aria-live="polite" aria-atomic="true" hidden>Çevrimdışı</span>
  </header>

  <div class="alt-cubuk" id="alt-cubuk" role="group" aria-label="Harita kontrolleri">
    <button type="button" class="kontrol-dugme" id="btn-konum" aria-label="Konumumu bul" title="Konumumu bul">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>
      <span>Konum</span>
    </button>
    <button type="button" class="kontrol-dugme" id="btn-anitkabir" aria-label="Anıtkabir'e dön" title="Anıtkabir'e dön">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 21h18M5 21V10l7-6 7 6v11"/><path d="M9 21v-6h6v6"/></svg>
      <span>Anıtkabir</span>
    </button>
    <button type="button" class="kontrol-dugme" id="btn-katmanlar" aria-label="Katmanlar" title="Katmanlar" aria-expanded="false" aria-haspopup="dialog" aria-controls="katman-karti">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 12 12 17 22 12"/><polyline points="2 17 12 22 22 17"/></svg>
      <span>Katmanlar</span>
    </button>
    <button type="button" class="kontrol-dugme" id="btn-kuzey" aria-label="Kuzeye çevir" title="Kuzeye çevir">
      <svg id="kuzey-simge" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polygon points="12 3 19 21 12 17 5 21 12 3"/></svg>
      <span>Kuzey</span>
    </button>
  </div>

  <div class="katman-karti" id="katman-karti" role="dialog" aria-modal="true" aria-label="Katmanlar ve taban seçimi" tabindex="-1" hidden>
    <label class="katman-satir"><input type="checkbox" id="cb-binalar" checked /> 3B Binalar</label>
    <label class="katman-satir"><input type="checkbox" id="cb-yapilar" checked /> Yapılar</label>
    <label class="katman-satir"><input type="checkbox" id="cb-numarataj" checked /> Numarataj</label>
    <label class="katman-satir"><input type="checkbox" id="cb-mahalleler" /> Mahalleler</label>
    <label class="katman-satir"><input type="checkbox" id="cb-yollar" /> Yollar</label>
    <div class="taban-secimi" role="group" aria-label="Harita tabanı">
      <button type="button" class="taban-dugme" id="taban-uydu" aria-pressed="true">Uydu</button>
      <button type="button" class="taban-dugme" id="taban-harita" aria-pressed="false">Harita</button>
    </div>
  </div>

  <!-- Bina bilgi kartı: role=dialog aria-modal=false, aria-labelledby/aria-describedby;
       Esc/dışarı dokunuş/Tab döngüsü js/uygulama.js'tedir; içerik yalnızca createElement ile doldurulur -->
  <div id="bina-karti" class="bina-karti" role="dialog" aria-modal="false" aria-labelledby="bina-karti-baslik" aria-describedby="bina-karti-aciklama" tabindex="-1" hidden>
    <span class="bina-karti__baslik" id="bina-karti-baslik"></span>
    <span class="bina-karti__sayac" id="bina-karti-sayac" hidden></span>
    <span id="bina-karti-aciklama" class="gorsel-gizli">Seçili yapı veya kapı numarası bilgileri. Kapatmak için Esc tuşuna basın.</span>
    <div class="bina-karti__satirlar"></div>
    <button type="button" id="bina-karti-kapat" aria-label="Bilgi kartını kapat" title="Kapat">✕</button>
  </div>

  <div id="bildirim" class="bildirim" role="status" aria-live="polite" aria-atomic="true" hidden></div>
  <div id="duyuru" class="gorsel-gizli" role="status" aria-live="polite" aria-atomic="true"></div>
  <div class="durum-satiri" id="durum-satiri" aria-hidden="true"></div>

  <!-- prefers-reduced-motion bayrağı: js/uygulama.js yüklenmeden tanımlanır;
       kamera hareketleri (view.goTo duration) bu bayrakla 0 yapılır (WCAG 2.1 AA) -->
  <script>
    window.__azaltilmisHareket = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    if (window.matchMedia) {
      try {
        window.matchMedia("(prefers-reduced-motion: reduce)").addEventListener("change", function (e) {
          window.__azaltilmisHareket = e.matches;
        });
      } catch (_) {}
    }
  </script>
  <script src="js/uygulama.js" fetchpriority="high"></script>
</body>
</html>
